  <!-- Privacy-friendly analytics by Plausible -->

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/form.css">
  <link rel="stylesheet" href="/css/table.css">
  <link rel="stylesheet" href="/css/list.css">

  <!-- KaTeX (replaces MathJax); auto-render scans for the delimiters used in the surface data -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>

  <!-- Bootstrap bundle (navbar collapse + tooltips); defer keeps it ahead of the deferred page scripts -->
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <script>
    // Shared KaTeX config for the delimiters used in the surface data.
    // auto-render omits single $ by default, so it is listed explicitly ($$ before $).
    window.katexOptions = {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "\\[", right: "\\]", display: true},
        {left: "$", right: "$", display: false},
        {left: "\\(", right: "\\)", display: false}
      ],
      // skip already-rendered subtrees so repeated passes (e.g. table expand-all) stay cheap
      ignoredClasses: ["katex"],
      throwOnError: false
    };
    // Render KaTeX inside a subtree (whole body by default). Safe to call repeatedly.
    window.renderMath = function (el) {
      if (window.renderMathInElement) renderMathInElement(el || document.body, window.katexOptions);
    };
  </script>
</head>

<body>

<div id="header">
  <nav class="navbar navbar-expand-md navbar-dark bg-dark p-0 position-relative d-print-none" id="menu">
    <button class="navbar-toggler m-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto mb-0 ps-3 ps-md-0">
        <li class="nav-item"><a class="nav-link py-2 text-white fw-bold" href="/table/">table</a></li>
      </ul>

      <!-- sibling sites: pinned right on desktop, stacked in the hamburger on mobile -->
      <ul class="navbar-nav mb-0 ps-3 ps-md-0 me-md-2">
        <li class="nav-item d-md-none mt-2 text-white-50">other:</li>
        <li class="nav-item"><a class="nav-link py-2" href="https://fanography.info"><img src="https://fanography.info/favicon.png" height="20" class="me-1">Fanography</a></li>
        <li class="nav-item"><a class="nav-link py-2" href="https://grassmannian.info"><img src="https://grassmannian.info/static/favicon.ico" height="20" class="me-1">Grassmannian.info</a></li>
        <li class="nav-item"><a class="nav-link py-2" href="https://hyperkaehler.info"><img src="https://hyperkaehler.info/static/favicon.ico" height="20" class="me-1">hyperkaehler.info</a></li>
      </ul>
    </div>
  </nav>

  <h1><a href="/">le superficie algebriche</a></h1>

</div>

{{ block "main" . }}{{ end }}

</html>
