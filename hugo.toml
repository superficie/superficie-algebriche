baseURL = "https://superficie.info/"
locale = "en-us"
title = "le superficie algebriche"

# Fully static: no taxonomies, no RSS
disableKinds = ["taxonomy", "term", "RSS"]

# Allow raw HTML in the Markdown content pages
[markup.goldmark.renderer]
unsafe = true

# Leave math delimiters untouched so client-side KaTeX renders them
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

# Keep straight quotes/dashes (no smart-quote substitution)
[markup.goldmark.extensions.typographer]
disable = true
